services:
  app:
    build:
      context: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:///tasks.db
    volumes:
      - ./data:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3